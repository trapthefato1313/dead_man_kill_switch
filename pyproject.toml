[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dead-man-kill-switch"
version = "0.1.0"
description = "Dead man's switch: liveness beacon and sealed-evidence release"
requires-python = ">=3.11"
dependencies = []
license = { text = "Proprietary" }
keywords = ["dead-man-switch", "liveness", "evidence", "gpg", "safety"]

[project.scripts]
dmks = "dmks.cli:main"

[tool.setuptools]
packages = ["dmks"]

[tool.ruff]
line-length = 100
target-version = "py311"